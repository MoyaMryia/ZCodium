[workspace]
resolver = "2"
members = ["crates/surface-contract", "crates/surface-backend", "crates/surface-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/moyamryia/ZCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "net",
  "signal",
  "time",
  "sync",
] }

# 平台 FFI。feature 集合在 P2–P4 实现对应后端时逐个收紧；
# 这里先按最小可用集声明，避免骨架阶段就锁死一个未经编译验证的组合。
[workspace.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Gdi",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
]

[workspace.dependencies.objc2]
version = "0.6"

[workspace.dependencies.zbus]
version = "5"

[workspace.dependencies.ashpd]
version = "0.13"
default-features = false

[workspace.dependencies.x11rb]
version = "0.14"

[workspace.dependencies.reis]
version = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
