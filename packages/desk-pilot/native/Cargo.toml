[workspace]
resolver = "2"
members = ["crates/surface-contract", "crates/surface-backend", "crates/surface-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/moyamryia/ZCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  "net",
  "signal",
  "time",
  "sync",
] }

# 工作区内部 crate 也必须走 workspace.dependencies，否则
# `surface-contract.workspace = true` 找不到可继承的条目。
surface-contract = { path = "crates/surface-contract" }
surface-backend = { path = "crates/surface-backend" }

# 平台 FFI。feature 集合在 P2–P4 实现对应后端时逐个收紧；
# 这里先按最小可用集声明，避免骨架阶段就锁死一个未经编译验证的组合。
[workspace.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Gdi",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
]

[workspace.dependencies.objc2]
version = "0.6"

[workspace.dependencies.zbus]
version = "5"

[workspace.dependencies.ashpd]
version = "0.13"
# default-features = false + 显式 tokio：ashpd 的 default 只开 tokio，但 portal 的各个
# API 都是独立 feature。Wayland 后端只需要 RemoteDesktop（libei 输入）、
# ScreenCast（PipeWire 截图）和 Clipboard（只写）三个，其余 portal 不拉进来。
# `backend` 提供 async-trait，是调用这些 API 的前置条件。
default-features = false
features = ["tokio", "backend", "remote_desktop", "screencast", "clipboard"]

[workspace.dependencies.x11rb]
version = "0.14"

[workspace.dependencies.reis]
version = "0.7"
features = ["tokio"]

[profile.release]
lto = true
codegen-units = 1
strip = true
