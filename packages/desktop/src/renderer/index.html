<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZCodium</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      /* 启动壳（透明窗口上的浮动 logo、遮罩与动画）已整套删除：启动画面只保留 React 的
         静态标记。这里只留一层纯色底，避免 React bundle 执行前主窗口（透明/vibrancy）
         露出桌面；bundle 载入后由共享 UI 样式的根背景接管。 */
      html {
        background: #161616;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
