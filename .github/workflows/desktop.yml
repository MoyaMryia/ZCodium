name: Desktop CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  HUSKY: "0"
  ZCODE_ENV: production
  ZCODE_SKIP_REMOTE_ASSETS: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release version
        run: node scripts/ci/desktop-release.mjs check-version
      - uses: ./.github/actions/setup-workspace
        id: setup
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint
      - name: Architecture
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm architecture:check
      - name: Release tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --test --test-isolation=none scripts/ci/*.test.mjs
      - name: Install browser for remote form checks
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Remote form browser checks
        run: node scripts/ci/remote-form-smoke.mjs
      - name: Bundled catalog browser checks
        run: node scripts/ci/client-catalog-smoke.mjs
      - name: Bundled help browser checks
        run: node scripts/ci/bundled-help-smoke.mjs
      - name: Local feedback browser checks
        run: node scripts/ci/local-feedback-smoke.mjs
      - name: Imported conversation browser checks
        run: node scripts/ci/local-share-context-smoke.mjs
      - name: Self-managed model settings
        run: |
          pnpm --filter @zcode/desktop build:no-runtime-assets
          node scripts/ci/self-managed-models-smoke.mjs
      - name: Model setup without official purchases
        run: node scripts/ci/no-official-purchase-smoke.mjs
      - name: Local preferences without official accounts
        run: node scripts/ci/local-preferences-smoke.mjs
      - name: Startup without official account restoration
        run: node scripts/ci/root-startup-smoke.mjs
      - name: Conversation file browser checks
        run: |
          node scripts/ci/conversation-export-smoke.mjs
          node scripts/ci/conversation-import-smoke.mjs

  remote-assets:
    name: Bundled Linux remote runtime
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build remote components from source
        run: pnpm prepare:remote-assets
      - name: Verify native remote runtime
        run: node scripts/ci/remote-assets-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    name: Build (${{ matrix.platform }} x64)
    needs: [checks, remote-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: win
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ZCODE_TARGET_OS: ${{ matrix.platform }}
      ZCODE_TARGET_ARCH: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools zstd
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundled-remote-linux-x64
          path: packages/desktop/bundled-remote-assets
      - name: Verify bundled remote components
        run: node scripts/bundle-remote-assets.mjs verify
      - name: Prepare desktop runtime
        run: pnpm prepare:desktop-runtime
      - name: Build workspace and desktop
        run: pnpm build:bootstrap
      - name: Package and verify desktop
        run: pnpm bundle:desktop -- --os "$ZCODE_TARGET_OS" --arch x64 --skip-prepare --skip-build
      - name: Collect installers
        run: node scripts/ci/desktop-release.mjs collect "$ZCODE_TARGET_OS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-x64
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          install-dependencies: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-x64
          path: dist/release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-win-x64
          path: dist/release-assets
      - name: Verify assets and create or update draft
        run: node scripts/ci/desktop-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
